name: Playwright Regression Tests

on:
  push:
    branches: [ main, feature/orangehrm-automation ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm ci

    - name: Install Playwright Browsers & OS Dependencies
      run: npx playwright install --with-deps

    - name: Execute Playwright Automation Tests
      run: npx playwright test
      env:
        BASE_URL: https://orangehrmlive.com

    - name: Upload Test Execution Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-execution-report
        path: playwright-report/
        retention-days: 30
