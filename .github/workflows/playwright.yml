name: Playwright E2E Tests
on:
  push:
    # 🎯 Configured strictly to trigger only on the main branch
    branches: [ "main" ]
  pull_request:
    # Triggers tests when opening a pull request aimed at the main branch
    branches: [ "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 🖼️ Generates a dummy profile picture for upload fields in tests
    - name: Generate mock profile picture for upload
      run: echo "mock image data" > profile.jpeg

    # 🚀 Executes tests (and starts any local web server defined in your playwright.config.ts)
    - name: Run Playwright tests
      run: npx playwright test

    # 📊 Saves the test report so you can download it if a test fails
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
