name: Playwright E2E Tests
on:
  push:
    # 🎯 Configured strictly to trigger only on your active branch
    branches: [ "main, master" ]
  pull_request:
    # Triggers tests when opening a pull request aimed at your branch
    branches: [ "main, master" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 🖼️ ADDED: Dynamically creates the profile photo so the runner can upload it during the PIM test
    - name: Generate mock profile picture for upload
      run: echo "mock image data" > profile.jpeg

    # 🚀 Spins up your live server automatically via your playwright.config.ts config and executes tests
    - name: Run Playwright tests
      run: npx playwright test

    # 📊 Optional: Saves the test report so you can download it if a test fails
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
